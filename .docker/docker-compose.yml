services:
  backend:
    build:
      context: ..
      dockerfile: .docker/backend.Dockerfile
      target: development
    container_name: devbridge_backend
    environment:
      PORT: 8080
      GO_ENV: development
      ALLOWED_ORIGINS: http://localhost:3010,http://frontend:3000
      DATABASE_URL: postgres://devbridge_user:devbridge_password@postgres:5432/devbridge?sslmode=disable
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      GOOGLE_OAUTH_REDIRECT_URL: ${GOOGLE_OAUTH_REDIRECT_URL}
    ports:
      - "8080:8080"
      - "2345:2345"
    volumes:
      - ../backend:/app
      - backend_uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - devbridge

  frontend:
    build:
      context: ..
      dockerfile: .docker/frontend.Dockerfile
      target: development
    container_name: devbridge_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      INTERNAL_API_URL: http://backend:8080/api/v1
    ports:
      - "3010:3000"
    volumes:
      - ../frontend:/app
    working_dir: /app
    stdin_open: true
    tty: true
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - devbridge

  ai:
    build:
      context: ..
      dockerfile: .docker/ai.Dockerfile
      target: development
    container_name: devbridge_ai
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      # Empty locally on purpose: with no token Logfire configures to a no-op
      # and the service makes no network call. See ai/app/main.py.
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
    ports:
      - "8001:8000"
    volumes:
      - ../ai:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - devbridge

  adminer:
    image: adminer:latest
    container_name: devbridge_adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8081:8080"
    restart: unless-stopped
    depends_on:
      - postgres
    networks:
      - devbridge

  postgres:
    image: postgres:16-alpine
    container_name: devbridge_postgres
    environment:
      POSTGRES_DB: devbridge
      POSTGRES_USER: devbridge_user
      POSTGRES_PASSWORD: devbridge_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devbridge_user -d devbridge"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - devbridge

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  devbridge:
    driver: bridge